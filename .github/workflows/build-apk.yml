name: Build GovMinutes APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK package
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare install package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GovMinutes_V1.apk
          sha256sum dist/GovMinutes_V1.apk > dist/SHA256.txt
          cd dist
          zip GovMinutes_V1_Install.zip GovMinutes_V1.apk SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GovMinutes-V1-verified
          path: |
            dist/GovMinutes_V1.apk
            dist/SHA256.txt
            dist/GovMinutes_V1_Install.zip
